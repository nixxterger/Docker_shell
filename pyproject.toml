[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-shell"
version = "1.3.0"
description = "Control what a Docker container may do with your folders — straight from the file manager (network isolation, RAM limits, read-only and masked mounts)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "nixxterger" }]
requires-python = ">=3.8"
dependencies = [
    "customtkinter>=5.2.0",
    "PyYAML>=6.0",
]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Repository = "https://github.com/nixxterger/Docker_shell"

[project.scripts]
docker-shell = "docker_shell:main"

[tool.setuptools]
py-modules = ["docker_shell"]
