name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (GUI deps are stubbed in the tests)
        run: pip install PyYAML

      - name: Syntax check
        run: python -m py_compile docker_shell.py tests/test_e2e.py

      - name: End-to-end tests (throwaway alpine container)
        run: python tests/test_e2e.py
